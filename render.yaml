services:
  - type: web
    name: mingle-messenger
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_VERIFY_EMAIL
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Mingle <onboarding@resend.dev>"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/messenger.sqlite
      - key: ATTACHMENT_PATH
        value: ./data/uploads
      - key: BCRYPT_ROUNDS
        value: "12"

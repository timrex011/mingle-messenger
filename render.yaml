services:
  - type: web
    name: mingle-messenger
    runtime: node
    plan: free
    buildCommand: npm install && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_VERIFY_EMAIL
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/messenger.sqlite
      - key: ATTACHMENT_PATH
        value: ./data/uploads
      - key: BCRYPT_ROUNDS
        value: "12"

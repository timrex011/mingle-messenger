services:
  - type: web
    name: mingle-messenger
    runtime: node
    plan: free
    buildCommand: npm install && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/messenger.sqlite
      - key: ATTACHMENT_PATH
        value: ./data/uploads
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: riftduels4@gmail.com
      - key: SMTP_PASSWORD
        value: wjxb vxcg embb yoyn
      - key: SMTP_FROM
        value: "mingle <riftduels4@gmail.com>"
      - key: BCRYPT_ROUNDS
        value: "12"

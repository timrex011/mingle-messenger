services:
  - type: web
    name: mingle-messenger
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OWNER_EMAIL
        value: "riftduels4@gmail.com"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: EMAILJS_USER_ID
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_PASSWORD_RESET
        sync: false
      - key: EMAILJS_TEMPLATE_EMAIL_VERIFY
        sync: false
      - key: EMAILJS_TEMPLATE_SECURITY_CODE
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/messenger.sqlite
      - key: ATTACHMENT_PATH
        value: ./data/uploads
      - key: BCRYPT_ROUNDS
        value: "12"

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mingle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0d13;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      user-select: none;
    }
    .card {
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #f0f6fc; }
    p { font-size: 13px; color: #8b949e; line-height: 1.5; margin-bottom: 20px; }
    .status {
      font-size: 12px;
      color: #6366f1;
      font-weight: 500;
    }
    .retry-btn {
      margin-top: 18px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover { background: #30363d; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Verbindung wird aufgebaut...</h1>
    <p>Mingle stellt automatisch eine Verbindung her. Bitte warte einen kurzen Moment.</p>
    <div class="status" id="countdown">Nächster Versuch in 3s...</div>
    <button class="retry-btn" onclick="retryNow()">Jetzt erneut versuchen</button>
  </div>

  <script>
    let secondsLeft = 3;
    let timer = null;

    function tick() {
      secondsLeft--;
      if (secondsLeft <= 0) {
        retryNow();
      } else {
        document.getElementById('countdown').textContent = `Nächster Versuch in ${secondsLeft}s...`;
      }
    }

    function retryNow() {
      clearInterval(timer);
      document.getElementById('countdown').textContent = 'Prüfe Verbindung...';
      if (window.electronAPI && window.electronAPI.setServerUrl) {
        window.electronAPI.setServerUrl('auto').catch(() => {
          secondsLeft = 3;
          timer = setInterval(tick, 1000);
        });
      } else {
        window.location.reload();
      }
    }

    timer = setInterval(tick, 1000);
  </script>
</body>
</html>
